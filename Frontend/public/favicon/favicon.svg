<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"></stop>
      <stop offset="100%" stop-color="#06b6d4"></stop>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"></rect>

  <!-- Book Group -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M14 18 Q28 12 32 16 L32 46 Q28 42 14 48 Z" fill="#ffffff"></path>

    <!-- Right Page -->
    <path d="M50 18 Q36 12 32 16 L32 46 Q36 42 50 48 Z" fill="#ffffff"></path>

    <!-- Spine -->
    <line x1="32" y1="16" x2="32" y2="46" stroke="#e0e7ff" stroke-width="2"></line>

    <!-- Page Lines -->
    <line x1="20" y1="26" x2="30" y2="24" stroke="#c7d2fe" stroke-width="1.5"></line>
    <line x1="20" y1="32" x2="30" y2="30" stroke="#c7d2fe" stroke-width="1.5"></line>
    <line x1="34" y1="24" x2="44" y2="26" stroke="#c7d2fe" stroke-width="1.5"></line>
    <line x1="34" y1="30" x2="44" y2="32" stroke="#c7d2fe" stroke-width="1.5"></line>
  </g>
</svg>